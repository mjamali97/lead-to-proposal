name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Node tests
        run: node --test test/node/
      - name: Python tests
        run: python -m pytest -q test/python
      - name: Offline demo
        run: node bin/l2p.mjs demo --out demo-output
      - name: Privacy scan
        run: node scripts/privacy-scan.mjs
